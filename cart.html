<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Everstmart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
}

.cart-box {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 18px 0;
    gap: 15px;
}

.item-info {
    flex: 1;
}

.item-name {
    font-size: 19px;
    font-weight: bold;
}

.item-price {
    margin-top: 6px;
    color: #555;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 22px;
}

.quantity span {
    font-size: 18px;
    font-weight: bold;
}

.remove {
    border: none;
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    color: #555;
}

.total {
    font-size: 24px;
    font-weight: bold;
    text-align: right;
    margin-top: 25px;
}

.checkout {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 18px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #111;
    text-decoration: none;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 50px 10px;
    font-size: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Your Cart</h1>
    <p>Everstmart — Tibetan Collection</p>
</header>

<div class="container">

    <div class="cart-box">

        <div id="cartItems"></div>

        <div id="cartTotal" class="total"></div>

        <button class="checkout" onclick="checkout()">
            Place Order
        </button>

        <a href="index.html" class="back">
            ← Continue Shopping
        </a>

    </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("everstmartCart")) || [];

function saveCart() {
    localStorage.setItem("everstmartCart", JSON.stringify(cart));
}

function displayCart() {

    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    if (cart.length === 0) {

        cartItems.innerHTML = `
            <div class="empty">
                🛒 Your cart is empty.
                <br><br>
                <a href="index.html">Start Shopping</a>
            </div>
        `;

        cartTotal.innerHTML = "";
        return;
    }

    let grouped = {};

    cart.forEach(item => {

        if (!grouped[item.name]) {
            grouped[item.name] = {
                name: item.name,
                price: item.price,
                quantity: 0
            };
        }

        grouped[item.name].quantity++;

    });

    let total = 0;

    cartItems.innerHTML = Object.values(grouped).map((item, index) => {

        total += item.price * item.quantity;

        return `
            <div class="cart-item">

                <div class="item-info">
                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-price">
                        ₹${item.price} × ${item.quantity}
                    </div>
                </div>

                <div class="quantity">

                    <button onclick="decrease('${item.name}')">
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button onclick="increase('${item.name}')">
                        +
                    </button>

                </div>

                <button class="remove"
                        onclick="removeItem('${item.name}')">
                    Remove
                </button>

            </div>
        `;

    }).join("");

    cartTotal.innerHTML =
        `Total: ₹${total.toLocaleString("en-IN")}`;
}

function increase(name) {

    const item = cart.find(item => item.name === name);

    if (item) {
        cart.push({
            name: item.name,
            price: item.price
        });
    }

    saveCart();
    displayCart();
}

function decrease(name) {

    const index = cart.findIndex(item => item.name === name);

    if (index !== -1) {
        cart.splice(index, 1);
    }

    saveCart();
    displayCart();
}

function removeItem(name) {

    cart = cart.filter(item => item.name !== name);

    saveCart();
    displayCart();
}

function checkout() {

  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  let total = cart.reduce((sum, item) => sum + item.price, 0);

  let grouped = {};

  cart.forEach(item => {
    if (!grouped[item.name]) {
      grouped[item.name] = {
    name: item.name,
    price: item.price,
    quantity: 0
};
    }

    grouped[item.name].quantity++;
  });

  let orderItems = Object.entries(grouped).map(([name, item]) => `
  <div style="padding:7px 0;">
    ${name} × ${item.quantity}
    — ₹${(item.price * item.quantity).toLocaleString("en-IN")}
  </div>
`).join("");

  let checkoutBox = document.createElement("div");

  checkoutBox.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  `;

  checkoutBox.innerHTML = `
    <div style="
      background:white;
      width:100%;
      max-width:500px;
      max-height:90vh;
      overflow-y:auto;
      border-radius:24px;
      padding:28px 24px;
      box-sizing:border-box;
    ">

      <h2 style="
        margin:0 0 8px;
        font-size:25px;
        text-align:center;
      ">
        🛒 Everstmart Checkout
      </h2>

      <p style="color:#666;">
        Please enter your delivery details.
      </p>

      <label><b>Full Name</b></label>

      <input id="customerName"
        type="text"
        placeholder="Enter your full name"
        style="
          width:100%;
          padding:14px 16px;
          margin:8px 0 18px;
          box-sizing:border-box;
          border:1px solid #ddd;
          border-radius:12px;
          font-size:16px;
        ">

      <label><b>Phone Number</b></label>

      <input id="customerPhone"
        type="tel"
        placeholder="Enter your 10-digit phone number"
        maxlength="10"
        inputmode="numeric"
        style="
          width:100%;
          padding:14px 16px;
          margin:8px 0 18px;
          box-sizing:border-box;
          border:1px solid #ddd;
          border-radius:12px;
          font-size:16px;
        ">

      <label><b>Delivery Address</b></label>

      <textarea id="customerAddress"
        placeholder="Enter your complete delivery address"
        rows="4"
        style="
          width:100%;
          padding:14px 16px;
          margin:8px 0 18px;
          box-sizing:border-box;
          border:1px solid #ddd;
          border-radius:12px;
          font-size:16px;
          resize:vertical;
        "></textarea>

      <label><b>PIN Code</b></label>

      <input id="customerPin"
        type="tel"
        placeholder="Enter 6-digit PIN code"
        maxlength="6"
        inputmode="numeric"
        style="
          width:100%;
          padding:14px 16px;
          margin:8px 0 18px;
          box-sizing:border-box;
          border:1px solid #ddd;
          border-radius:12px;
          font-size:16px;
        ">

      <h3 style="margin:20px 0 10px;">
        Order Summary
      </h3>

      <div style="
        background:#f8f8f8;
        padding:16px;
        border:1px solid #eee;
        border-radius:14px;
        margin-bottom:20px;
      ">

        ${orderItems}

        <hr>

        <b style="
          font-size:20px;
          display:block;
          text-align:right;
        ">
          Total: ₹${total.toLocaleString("en-IN")}
        </b>

      </div>

      <button id="payUPIBtn" style="
        width:100%;
        padding:15px;
        background:#111;
        color:white;
        border:none;
        border-radius:10px;
        font-size:17px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        💳 Pay with UPI
      </button>

      <button id="whatsappOrderBtn" style="
        width:100%;
        padding:15px;
        background:#25D366;
        color:white;
        border:none;
        border-radius:10px;
        font-size:17px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        📲 Place Order on WhatsApp
      </button>

      <button id="closeCheckoutBtn" style="
        width:100%;
        padding:13px;
        background:#eee;
        color:#333;
        border:none;
        border-radius:10px;
        font-size:16px;
      ">
        Cancel
      </button>

    </div>
  `;

  document.body.appendChild(checkoutBox);


  document.getElementById("closeCheckoutBtn").onclick = function() {
    checkoutBox.remove();
  };


  document.getElementById("whatsappOrderBtn").onclick = function() {

    let name = document.getElementById("customerName").value.trim();
    let phone = document.getElementById("customerPhone").value.trim();
    let address = document.getElementById("customerAddress").value.trim();
    let pin = document.getElementById("customerPin").value.trim();

    if (!name) {
      alert("Please enter your full name.");
      return;
    }

    if (!/^[6-9]\d{9}$/.test(phone)) {
      alert("Please enter a valid 10-digit Indian mobile number.");
      return;
    }

    if (!address) {
      alert("Please enter your delivery address.");
      return;
    }

    if (!/^[1-9][0-9]{5}$/.test(pin)) {
      alert("Please enter a valid 6-digit Indian PIN code.");
      return;
    }

      let orderId = "EM-" + Date.now();

let orderDate = new Date().toLocaleDateString("en-IN");
let orderTime = new Date().toLocaleTimeString("en-IN", {
    hour: "2-digit",
    minute: "2-digit"
});

let orderDetails =
    "EVERSTMART ORDER\n\n" +
    "Order ID: " + orderId + "\n" +
    "Date: " + orderDate + "\n" +
    "Time: " + orderTime + "\n" +
    "Customer: " + name + "\n" +
      "Phone: " + phone + "\n" +
      "Address: " + address + "\n" +
      "PIN Code: " + pin + "\n\n" +
      "Products:\n" +
      Object.values(grouped)
        .map(item =>
          item.name +
          " × " +
          item.quantity +
          " — ₹" +
          (item.price * item.quantity).toLocaleString("en-IN")
        )
        .join("\n") +
      "\n\nTotal: ₹" +
      total.toLocaleString("en-IN");

    let whatsappURL =
      "https://wa.me/918580804579?text=" +
      encodeURIComponent(orderDetails);

    window.location.href = whatsappURL;
  };


  document.getElementById("payUPIBtn").onclick = function() {

    let upiId = "Karmagyaltsen789@oksbi";
    let merchantName = "Everstmart";

    let upiURL =
      "upi://pay?pa=" +
      encodeURIComponent(upiId) +
      "&pn=" +
      encodeURIComponent(merchantName) +
      "&am=" +
      total.toFixed(2) +
      "&cu=INR";

    window.location.href = upiURL;
  };

}

displayCart();

</script>

</body>
</html>
