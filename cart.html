<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart - Everstmart</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
}

.cart-box {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 18px 0;
    gap: 15px;
}

.item-info {
    flex: 1;
}

.item-name {
    font-size: 19px;
    font-weight: bold;
}

.item-price {
    margin-top: 6px;
    color: #555;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 22px;
}

.quantity span {
    font-size: 18px;
    font-weight: bold;
}

.remove {
    border: none;
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    color: #555;
}

.total {
    font-size: 24px;
    font-weight: bold;
    text-align: right;
    margin-top: 25px;
}

.checkout {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 18px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #111;
    text-decoration: none;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 50px 10px;
    font-size: 20px;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Your Cart</h1>
    <p>Everstmart — Tibetan Collection</p>
</header>

<div class="container">

    <div class="cart-box">

        <div id="cartItems"></div>

        <div id="cartTotal" class="total"></div>

        <button class="checkout" onclick="checkout()">
            Place Order
        </button>

        <a href="index.html" class="back">
            ← Continue Shopping
        </a>

    </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("everstmartCart")) || [];

function saveCart() {
    localStorage.setItem("everstmartCart", JSON.stringify(cart));
}

function displayCart() {

    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    if (cart.length === 0) {

        cartItems.innerHTML = `
            <div class="empty">
                🛒 Your cart is empty.
                <br><br>
                <a href="index.html">Start Shopping</a>
            </div>
        `;

        cartTotal.innerHTML = "";
        return;
    }

    let grouped = {};

    cart.forEach(item => {

        if (!grouped[item.name]) {
            grouped[item.name] = {
                name: item.name,
                price: item.price,
                quantity: 0
            };
        }

        grouped[item.name].quantity++;

    });

    let total = 0;

    cartItems.innerHTML = Object.values(grouped).map((item, index) => {

        total += item.price * item.quantity;

        return `
            <div class="cart-item">

                <div class="item-info">
                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-price">
                        ₹${item.price} × ${item.quantity}
                    </div>
                </div>

                <div class="quantity">

                    <button onclick="decrease('${item.name}')">
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button onclick="increase('${item.name}')">
                        +
                    </button>

                </div>

                <button class="remove"
                        onclick="removeItem('${item.name}')">
                    Remove
                </button>

            </div>
        `;

    }).join("");

    cartTotal.innerHTML =
        `Total: ₹${total.toLocaleString("en-IN")}`;
}

function increase(name) {

    const item = cart.find(item => item.name === name);

    if (item) {
        cart.push({
            name: item.name,
            price: item.price
        });
    }

    saveCart();
    displayCart();
}

function decrease(name) {

    const index = cart.findIndex(item => item.name === name);

    if (index !== -1) {
        cart.splice(index, 1);
    }

    saveCart();
    displayCart();
}

function removeItem(name) {

    cart = cart.filter(item => item.name !== name);

    saveCart();
    displayCart();
}

function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    alert("Order checkout coming next!");
}

displayCart();

</script>

</body>
</html>
