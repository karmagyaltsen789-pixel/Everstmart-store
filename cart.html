<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Cart - Everstmart</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
}

.cart-box {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding: 18px 0;
    gap: 15px;
}

.item-info {
    flex: 1;
}

.item-name {
    font-size: 19px;
    font-weight: bold;
}

.item-price {
    margin-top: 6px;
    color: #555;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity button {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 22px;
}

.quantity span {
    font-size: 18px;
    font-weight: bold;
}

.remove {
    border: none;
    background: #eee;
    padding: 8px 12px;
    border-radius: 8px;
    color: #555;
}

.total {
    font-size: 24px;
    font-weight: bold;
    text-align: right;
    margin-top: 25px;
}

.checkout {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 18px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #111;
    text-decoration: none;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 50px 10px;
    font-size: 20px;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    .cart-box {
        padding: 20px;
    }

    .cart-item {
        flex-wrap: wrap;
    }

    .item-info {
        width: 100%;
        flex-basis: 100%;
    }

    .quantity {
        margin-top: 5px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛒 Your Cart</h1>
    <p>Everstmart — Tibetan Collection</p>
</header>

<div class="container">

    <div class="cart-box">

        <div id="cartItems"></div>

        <div id="cartTotal" class="total"></div>

        <button id="placeOrderBtn" class="checkout">
            Place Order
        </button>

        <a href="index.html" class="back">
            ← Continue Shopping
        </a>

    </div>

</div>

<script>

(function () {

    "use strict";

    let cart = [];

    const stockLimits = {
        "Tibetan Traditional Carpet": 10,
        "Potala Incense": 50
    };

    function loadCart() {

        try {

            const savedCart =
                localStorage.getItem("everstmartCart");

            if (savedCart) {
                const parsedCart = JSON.parse(savedCart);

                if (Array.isArray(parsedCart)) {
                    cart = parsedCart;
                } else {
                    cart = [];
                }
            } else {
                cart = [];
            }

        } catch (error) {

            console.error("Cart loading error:", error);

            cart = [];
        }
    }

    function saveCart() {

        try {
            localStorage.setItem(
                "everstmartCart",
                JSON.stringify(cart)
            );
        } catch (error) {
            console.error("Cart saving error:", error);
        }
    }

    function groupCart() {

        const grouped = {};

        cart.forEach(function (item) {

            if (!item || !item.name) {
                return;
            }

            if (!grouped[item.name]) {

                grouped[item.name] = {
                    name: item.name,
                    price: Number(item.price) || 0,
                    quantity: 0
                };
            }

            grouped[item.name].quantity++;

        });

        return grouped;
    }

    function calculateTotal() {

        return cart.reduce(function (sum, item) {

            return sum + (Number(item.price) || 0);

        }, 0);
    }

    function displayCart() {

        const cartItems =
            document.getElementById("cartItems");

        const cartTotal =
            document.getElementById("cartTotal");

        if (!cartItems || !cartTotal) {
            return;
        }

        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty">
                    🛒 Your cart is empty.
                    <br><br>
                    <a href="index.html">
                        Start Shopping
                    </a>
                </div>
            `;

            cartTotal.innerHTML = "";

            return;
        }

        const grouped = groupCart();

        let html = "";

        Object.values(grouped).forEach(function (item) {

            html += `
                <div class="cart-item">

                    <div class="item-info">

                        <div class="item-name">
                            ${escapeHTML(item.name)}
                        </div>

                        <div class="item-price">
                            ₹${item.price.toLocaleString("en-IN")}
                            × ${item.quantity}
                        </div>

                    </div>

                    <div class="quantity">

                        <button
                            type="button"
                            data-action="decrease"
                            data-name="${escapeAttribute(item.name)}">
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            type="button"
                            data-action="increase"
                            data-name="${escapeAttribute(item.name)}">
                            +
                        </button>

                    </div>

                    <button
                        type="button"
                        class="remove"
                        data-action="remove"
                        data-name="${escapeAttribute(item.name)}">
                        Remove
                    </button>

                </div>
            `;
        });

        cartItems.innerHTML = html;

        const total = calculateTotal();

        cartTotal.innerHTML =
            "Total: ₹" +
            total.toLocaleString("en-IN");

    }

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function increase(name) {

        const item =
            cart.find(function (product) {
                return product.name === name;
            });

        if (!item) {
            return;
        }

        const currentQuantity =
            cart.filter(function (product) {
                return product.name === name;
            }).length;

        const availableStock =
            stockLimits[name];

        if (
            availableStock !== undefined &&
            currentQuantity >= availableStock
        ) {

            alert(
                "Only " +
                availableStock +
                " available for " +
                name +
                "."
            );

            return;
        }

        cart.push({
            id: item.id,
            name: item.name,
            price: item.price
        });

        saveCart();
        displayCart();
    }

    function decrease(name) {

        const index =
            cart.findIndex(function (item) {
                return item.name === name;
            });

        if (index !== -1) {
            cart.splice(index, 1);
        }

        saveCart();
        displayCart();
    }

    function removeItem(name) {

        cart = cart.filter(function (item) {
            return item.name !== name;
        });

        saveCart();
        displayCart();
    }

    function openCheckout() {

        if (cart.length === 0) {

            alert("Your cart is empty.");

            return;
        }

        const total = calculateTotal();

        const grouped = groupCart();

        let orderItems = "";

        Object.values(grouped).forEach(function (item) {

            orderItems += `
                <div style="padding:7px 0;">
                    ${escapeHTML(item.name)}
                    × ${item.quantity}
                    — ₹${(
                        item.price * item.quantity
                    ).toLocaleString("en-IN")}
                </div>
            `;
        });

        const checkoutBox =
            document.createElement("div");

        checkoutBox.id = "checkoutBox";

        checkoutBox.style.cssText = `
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.65);
            z-index:9999;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            box-sizing:border-box;
        `;

        checkoutBox.innerHTML = `

            <div style="
                background:white;
                width:100%;
                max-width:500px;
                max-height:90vh;
                overflow-y:auto;
                border-radius:24px;
                padding:28px 24px;
                box-sizing:border-box;
            ">

                <h2 style="
                    margin:0 0 8px;
                    font-size:25px;
                    text-align:center;
                ">
                    🛒 Everstmart Checkout
                </h2>

                <p style="color:#666;">
                    Please enter your delivery details.
                </p>

                <label>
                    <b>Full Name</b>
                </label>

                <input
                    id="customerName"
                    type="text"
                    placeholder="Enter your full name"
                    style="
                        width:100%;
                        padding:14px 16px;
                        margin:8px 0 18px;
                        box-sizing:border-box;
                        border:1px solid #ddd;
                        border-radius:12px;
                        font-size:16px;
                    "
                >

                <label>
                    <b>Phone Number</b>
                </label>

                <input
                    id="customerPhone"
                    type="tel"
                    placeholder="Enter your 10-digit phone number"
                    maxlength="10"
                    inputmode="numeric"
                    style="
                        width:100%;
                        padding:14px 16px;
                        margin:8px 0 18px;
                        box-sizing:border-box;
                        border:1px solid #ddd;
                        border-radius:12px;
                        font-size:16px;
                    "
                >

                <label>
                    <b>Delivery Address</b>
                </label>

                <textarea
                    id="customerAddress"
                    placeholder="Enter your complete delivery address"
                    rows="4"
                    style="
                        width:100%;
                        padding:14px 16px;
                        margin:8px 0 18px;
                        box-sizing:border-box;
                        border:1px solid #ddd;
                        border-radius:12px;
                        font-size:16px;
                        resize:vertical;
                    "
                ></textarea>

                <label>
                    <b>PIN Code</b>
                </label>

                <input
                    id="customerPin"
                    type="tel"
                    placeholder="Enter 6-digit PIN code"
                    maxlength="6"
                    inputmode="numeric"
                    style="
                        width:100%;
                        padding:14px 16px;
                        margin:8px 0 18px;
                        box-sizing:border-box;
                        border:1px solid #ddd;
                        border-radius:12px;
                        font-size:16px;
                    "
                >

                <h3 style="margin:20px 0 10px;">
                    Order Summary
                </h3>

                <div style="
                    background:#f8f8f8;
                    padding:16px;
                    border:1px solid #eee;
                    border-radius:14px;
                    margin-bottom:20px;
                ">

                    ${orderItems}

                    <hr>

                    <b style="
                        font-size:20px;
                        display:block;
                        text-align:right;
                    ">
                        Total:
                        ₹${total.toLocaleString("en-IN")}
                    </b>

                </div>

                <button
                    id="payUPIBtn"
                    type="button"
                    style="
                        width:100%;
                        padding:15px;
                        background:#111;
                        color:white;
                        border:none;
                        border-radius:10px;
                        font-size:17px;
                        font-weight:bold;
                        margin-bottom:10px;
                    "
                >
                    💳 Pay with UPI
                </button>

                <button
                    id="whatsappOrderBtn"
                    type="button"
                    style="
                        width:100%;
                        padding:15px;
                        background:#25D366;
                        color:white;
                        border:none;
                        border-radius:10px;
                        font-size:17px;
                        font-weight:bold;
                        margin-bottom:10px;
                    "
                >
                 💬 Direct Enquiry on WhatsApp
                </button>

                <button
                    id="closeCheckoutBtn"
                    type="button"
                    style="
                        width:100%;
                        padding:13px;
                        background:#eee;
                        color:#333;
                        border:none;
                        border-radius:10px;
                        font-size:16px;
                    "
                >
                    Cancel
                </button>

            </div>
        `;

        document.body.appendChild(checkoutBox);

        document
            .getElementById("closeCheckoutBtn")
            .addEventListener("click", function () {

                checkoutBox.remove();

            });

       document
  .getElementById("whatsappOrderBtn")
  .addEventListener("click", function () {

    const whatsappURL =
      "https://wa.me/918580804579?text=" +
      encodeURIComponent(
        "Hello Everstmart, I would like to make an enquiry."
      );

    window.location.href = whatsappURL;

  }); 

        document
            .getElementById("payUPIBtn")
            .addEventListener("click", function () {

                startRazorpayPayment(
                    grouped,
                    total
                );

            });

    }

    function getCustomerDetails() {

        const name =
            document.getElementById("customerName")
                .value.trim();

        const phone =
            document.getElementById("customerPhone")
                .value.trim();

        const address =
            document.getElementById("customerAddress")
                .value.trim();

        const pin =
            document.getElementById("customerPin")
                .value.trim();

        if (!name) {
            alert("Please enter your full name.");
            return null;
        }

        if (!/^[6-9]\d{9}$/.test(phone)) {
            alert(
                "Please enter a valid 10-digit Indian mobile number."
            );
            return null;
        }

        if (!address) {
            alert("Please enter your delivery address.");
            return null;
        }

        if (!/^[1-9][0-9]{5}$/.test(pin)) {
            alert(
                "Please enter a valid 6-digit Indian PIN code."
            );
            return null;
        }

        return {
            name: name,
            phone: phone,
            address: address,
            pin: pin
        };
    }

    function createOrderDetails(
        customer,
        grouped,
        total,
        paymentId
    ) {

        const orderId =
            "EM-" + Date.now();

        const now = new Date();

        const orderDate =
            now.toLocaleDateString("en-IN");

        const orderTime =
            now.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit"
            });

        let products = "";

        Object.values(grouped).forEach(function (item) {

            products +=
                item.name +
                " × " +
                item.quantity +
                " — ₹" +
                (
                    item.price *
                    item.quantity
                ).toLocaleString("en-IN") +
                "\n";

        });

        let details =
            "🛍️ EVERSTMART ORDER\n\n" +

            "🆔 Order ID: " +
            orderId +
            "\n" +

            "📅 Date: " +
            orderDate +
            "\n" +

            "🕐 Time: " +
            orderTime +
            "\n\n" +

            "👤 CUSTOMER DETAILS\n" +

            "Name: " +
            customer.name +
            "\n" +

            "Phone: " +
            customer.phone +
            "\n" +

            "Address: " +
            customer.address +
            "\n" +

            "PIN Code: " +
            customer.pin +
            "\n\n" +

            "📦 PRODUCTS\n" +

            products +

            "\n💰 TOTAL: ₹" +
            total.toLocaleString("en-IN");

        if (paymentId) {

            details +=
                "\n\n💳 Payment ID: " +
                paymentId;
        }

        details +=
            "\n\nThank you for shopping with Everstmart! 🙏";

        return {
            orderId: orderId,
            date: orderDate,
            time: orderTime,
            details: details
        };
    }

    function placeWhatsAppOrder(
        grouped,
        total
    ) {

        const customer =
            getCustomerDetails();

        if (!customer) {
            return;
        }

        const order =
            createOrderDetails(
                customer,
                grouped,
                total,
                null
            );

        const whatsappURL =
            "https://wa.me/918580804579?text=" +
            encodeURIComponent(order.details);

        window.location.href =
            whatsappURL;
    }

    async function startRazorpayPayment(
        grouped,
        total
    ) {

        const customer =
            getCustomerDetails();

        if (!customer) {
            return;
        }

        try {

            const response =
                await fetch("https://everstmart-store.vercel.app/api/razorpay", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        action: "create",
                        amount: total
                    })
                });

            const orderData =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    orderData.error ||
                    "Unable to create payment order"
                );
            }

            const options = {

                key: orderData.key_id,

                amount: orderData.amount,

                currency:
                    orderData.currency,

                name: "Everstmart",

                description:
                    "Everstmart Order",

                order_id:
                    orderData.order_id,

                prefill: {
                    name: customer.name,
                    contact: customer.phone
                },

                theme: {
                    color: "#111111"
                },

                handler:
                    async function (
                        paymentResponse
                    ) {

                        try {

                            const verifyResponse =
                                await fetch(
                                    "https://everstmart-store.vercel.app/api/razorpay",
                                    {
                                        method: "POST",
                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },
                                        body:
                                            JSON.stringify({
                                                action:
                                                    "verify",

                                                razorpay_order_id:
                                                    paymentResponse
                                                        .razorpay_order_id,

                                                razorpay_payment_id:
                                                    paymentResponse
                                                        .razorpay_payment_id,

                                                razorpay_signature:
                                                    paymentResponse
                                                        .razorpay_signature
                                            })
                                    }
                                );

                            const verifyData =
                                await verifyResponse
                                    .json();

                            if (
                                !verifyResponse.ok ||
                                !verifyData.success
                            ) {

                                throw new Error(
                                    "Payment verification failed"
                                );
                            }

                            const order =
                                createOrderDetails(
                                    customer,
                                    grouped,
                                    total,
                                    paymentResponse
                                        .razorpay_payment_id
                                );

                            const completedOrder = {

                                orderId:
                                    order.orderId,

                                date:
                                    order.date,

                                time:
                                    order.time,

                                name:
                                    customer.name,

                                phone:
                                    customer.phone,

                                address:
                                    customer.address,

                                pin:
                                    customer.pin,

                                total:
                                    total,

                                paymentStatus:
                                    "Paid",

                                razorpayPaymentId:
                                    paymentResponse
                                        .razorpay_payment_id,

                                razorpayOrderId:
                                    paymentResponse
                                        .razorpay_order_id
                            };

                            localStorage.setItem(
                                "everstmartCompletedOrder",
                                JSON.stringify(
                                    completedOrder
                                )
                            );

                            const whatsappURL =
                                "https://wa.me/918580804579?text=" +
                                encodeURIComponent(
                                    order.details
                                );

                            window.location.href =
                                whatsappURL;

                        } catch (error) {

                            console.error(
                                error
                            );

                            alert(
                                "Payment was received, but verification could not be completed. Please contact Everstmart."
                            );
                        }
                    },

                modal: {

                    ondismiss:
                        function () {

                            console.log(
                                "Razorpay checkout closed."
                            );

                        }

                }

            };

            if (
                typeof Razorpay ===
                "undefined"
            ) {

                alert(
                    "Payment system is not available right now. Please try WhatsApp ordering."
                );

                return;
            }

            const razorpay =
                new Razorpay(options);

            razorpay.open();

        } catch (error) {

            console.error(error);

            alert(
                "Unable to start payment. Please try again."
            );
        }
    }

    document
        .getElementById("placeOrderBtn")
        .addEventListener(
            "click",
            openCheckout
        );

    document
        .getElementById("cartItems")
        .addEventListener(
            "click",
            function (event) {

                const button =
                    event.target.closest(
                        "button"
                    );

                if (!button) {
                    return;
                }

                const action =
                    button.dataset.action;

                const name =
                    button.dataset.name;

                if (action === "increase") {
                    increase(name);
                }

                if (action === "decrease") {
                    decrease(name);
                }

                if (action === "remove") {
                    removeItem(name);
                }

            }
        );

    loadCart();

    displayCart();

})();

</script>

</body>
</html>
