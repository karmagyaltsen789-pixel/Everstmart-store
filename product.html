<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - Everstmart</title>
<meta name="description" content="Tibetan and Himalayan-inspired products from Everstmart.">
<meta property="og:title" content="Everstmart | Tibetan &amp; Himalayan Products">
<meta property="og:description" content="Tibetan and Himalayan-inspired products from Everstmart.">
<meta property="og:url" content="https://www.everstmart.in/">
<meta property="og:site_name" content="Everstmart">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">
<meta property="og:image" content="https://www.everstmart.in/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.everstmart.in/og-image.jpg">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    color: #222;
}

/* Header */

header {
    background: #111;
    color: white;
    padding: 15px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 5px 0 0;
    color: #ccc;
    font-size: 14px;
}

/* Product */

.product-page {
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
}

.product-box {
    background: white;
    border-radius: 20px;
    padding: 30px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.product-image {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 15px;
}

.product-info h2 {
    font-size: 32px;
    margin: 0 0 10px;
}

.category {
    color: #777;
    font-size: 15px;
    margin-bottom: 15px;
}
    .stock {
    font-size: 17px;
    font-weight: bold;
    margin: 15px 0;
}

.price {
    font-size: 28px;
    font-weight: bold;
    margin: 15px 0 25px;
}

.description {
    color: #555;
    font-size: 17px;
    line-height: 1.7;
}
    .product-details {
    margin-top: 25px;
    padding: 20px;
    background: #f7f7f7;
    border-radius: 12px;
}

.product-details h3 {
    margin-top: 20px;
    margin-bottom: 10px;
    font-size: 20px;
}

.product-details h3:first-child {
    margin-top: 0;
}

.product-details p {
    margin: 8px 0;
    line-height: 1.6;
}

.product-details ul {
    margin: 10px 0 20px;
    padding-left: 20px;
}

.product-details li {
    margin-bottom: 8px;
    line-height: 1.5;
}

.info-box {
    background: #f7f7f7;
    padding: 15px;
    border-radius: 12px;
    margin: 20px 0;
}

.info-box p {
    margin: 8px 0;
}

/* Quantity */

.quantity-box {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 20px 0;
}

.quantity-box button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 22px;
}

.quantity-box span {
    font-size: 20px;
    font-weight: bold;
}

/* Buttons */

.action-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}

.action-button:hover {
    opacity: 0.85;
}

.buy-button {
    background: #333;
}

/* Back */

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #111;
    text-decoration: none;
    font-weight: bold;
}

/* Mobile */

@media (max-width: 700px) {

    .product-page {
        margin: 20px auto;
        padding: 15px;
    }

    .product-box {
        grid-template-columns: 1fr;
        padding: 20px;
        gap: 25px;
    }

    .product-info h2 {
        font-size: 27px;
    }

    .price {
        font-size: 25px;
    }

}

</style>

</head>

<body>

<header>

    <h1>Everstmart</h1>
    <p>Tibetan Collection</p>

</header>


<div class="product-page">

    <a href="index.html" class="back">
        ← Back to Shop
    </a>


    <div class="product-box">

        <div>

            <img
                id="productImage"
                class="product-image"
                src=""
                alt=""
            >

        </div>


        <div class="product-info">

            <h2 id="productName"></h2>

            <div id="productCategory" class="category"></div>

            <div id="productPrice" class="price"></div>
            <div id="productStock" class="stock"></div>

            <p id="productDescription" class="description"></p>


            

<div class="product-details" id="productDetails">
</div>



    <div id="packSelectorBox" style="display:none;">

    <h3>Choose Pack</h3>

    <select id="packSelect" onchange="selectPack()" style="
        width:100%;
        padding:14px;
        border:1px solid #ddd;
        border-radius:10px;
        font-size:16px;
        background:white;
        margin-bottom:10px;
    ">
    </select>

    <div id="wholesaleBox" style="
        margin:12px 0 20px;
        padding:12px 15px;
        background:#f7f7f7;
        border-radius:10px;
        font-size:15px;
        color:#555;
        display:none;
    ">
        <strong>Wholesale Available</strong><br>
        Contact us for wholesale pricing.
    </div>

</div>


            <button
    id="addToCartButton"
                class="action-button"
                onclick="addProductToCart()"
            >
                🛒 Add to Cart
            </button>


            <button
                id="buyNowButton"
                class="action-button buy-button"
                onclick="buyProductNow()"
            >
                ⚡ Buy Now
            </button>

        </div>

    </div>

</div>


<script src="products.js"></script>
<script>
const defaultShipping = [
    "🚚 Free Shipping across India",
    "📦 Processing time: 2–3 business days",
    "🚚 Estimated delivery: 5–10 business days"
];
    
const products = window.EVERSTMART_PRODUCTS;


const params = new URLSearchParams(window.location.search);

const productId = params.get("id") || "carpet";

const product = products[productId];


/* Page title and description for search engines and browser tabs */
if (product) {

    document.title = product.name + " | Everstmart";

    /* Share-preview tags (updated for crawlers that run scripts) */
    function setOg(prop, value) {
        let el = document.querySelector('meta[property="' + prop + '"]');
        if (!el) { el = document.createElement("meta"); el.setAttribute("property", prop); document.head.appendChild(el); }
        el.setAttribute("content", value);
    }
    setOg("og:title", product.name + " | Everstmart");
    setOg("og:url", "https://www.everstmart.in/product.html?id=" + encodeURIComponent(productId));
    const firstImg = (product.images && product.images[0]) || product.image;
    if (firstImg) setOg("og:image", "https://www.everstmart.in/" + encodeURI(firstImg));

    let canonicalLink = document.querySelector('link[rel="canonical"]');

    if (!canonicalLink) {
        canonicalLink = document.createElement("link");
        canonicalLink.setAttribute("rel", "canonical");
        document.head.appendChild(canonicalLink);
    }

    canonicalLink.setAttribute(
        "href",
        "https://www.everstmart.in/product.html?id=" + encodeURIComponent(productId)
    );

    let metaDescription = document.querySelector('meta[name="description"]');

    if (!metaDescription) {
        metaDescription = document.createElement("meta");
        metaDescription.setAttribute("name", "description");
        document.head.appendChild(metaDescription);
    }

    let summary = String(product.description || "").replace(/\s+/g, " ").trim();

    if (summary.length > 155) {
        summary = summary.slice(0, 155).replace(/\s+\S*$/, "") + "...";
    }

    metaDescription.setAttribute(
        "content",
        product.name + " from Everstmart. " + summary
    );
}



if (!product) {

    document.body.innerHTML = `
        <div style="
            text-align:center;
            padding:80px 20px;
            font-family:Arial;
        ">
            <h2>Product not found</h2>
            <a href="index.html">
                ← Back to Shop
            </a>
        </div>
    `;

} else {

    document.getElementById("productName").textContent =
        product.name;

    document.getElementById("productCategory").textContent =
        product.category;

    document.getElementById("productPrice").textContent =
        "₹" + product.price.toLocaleString("en-IN");
    const stockBox = document.getElementById("productStock");

if (product.stock > 0) {
    stockBox.textContent =
        "🟢 In Stock — " + product.stock + " available";
} else {
    stockBox.textContent =
        "🔴 Out of Stock";
}
        const addToCartButton = document.getElementById("addToCartButton");
    const buyNowButton = document.getElementById("buyNowButton");

    if (product.stock <= 0) {
        addToCartButton.disabled = true;
        buyNowButton.disabled = true;

        addToCartButton.textContent = "❌ Out of Stock";
        buyNowButton.textContent = "❌ Out of Stock";
    }

    document.getElementById("productDescription").textContent =
        product.description;

    const productImage = document.getElementById("productImage");

const productImages = product.images || [product.image];

productImage.src = productImages[0];
productImage.alt = product.name;

if (productImages.length > 1) {

    const gallery = document.createElement("div");

    gallery.style.display = "flex";
    gallery.style.gap = "10px";
    gallery.style.marginTop = "15px";
    gallery.style.overflowX = "auto";

    productImages.forEach((image, index) => {

        const thumbnail = document.createElement("img");

        thumbnail.src = image;
        thumbnail.alt = product.name;

        thumbnail.style.width = "80px";
        thumbnail.style.height = "80px";
        thumbnail.style.objectFit = "cover";
        thumbnail.style.borderRadius = "10px";
        thumbnail.style.cursor = "pointer";
        thumbnail.style.border =
            index === 0
                ? "2px solid #111"
                : "2px solid transparent";

        thumbnail.onclick = function () {

            productImage.src = image;

            document.querySelectorAll(".product-thumbnail")
                .forEach(img => {
                    img.style.border = "2px solid transparent";
                });

            thumbnail.style.border = "2px solid #111";
        };

        thumbnail.className = "product-thumbnail";

        gallery.appendChild(thumbnail);
    });

    productImage.parentElement.appendChild(gallery);
}

const detailsBox = document.getElementById("productDetails");

detailsBox.innerHTML = `
    <h3>Product Details</h3>

    ${product.details.productDetails.map(detail => `
        <p>
            <strong>${detail[0]}:</strong>
            ${detail[1]}
        </p>
    `).join("")}

    <h3>Care Instructions</h3>

    <ul>
        ${product.details.careInstructions.map(instruction => `
            <li>${instruction}</li>
        `).join("")}
    </ul>

    <h3>Delivery & Shipping</h3>

    <ul>
        ${defaultShipping.map(info => `
            <li>${info}</li>
        `).join("")}
    </ul>
`;

}

let selectedPackPrice = product ? product.price : 0;


/* Pack Selector */

function setupPackSelector() {

    const packSelectorBox =
        document.getElementById("packSelectorBox");

    const packSelect =
        document.getElementById("packSelect");

    const wholesaleBox =
        document.getElementById("wholesaleBox");

    if (!product.packOptions) {

        packSelectorBox.style.display = "none";

        return;
    }

    packSelectorBox.style.display = "block";

    packSelect.innerHTML = "";

    product.packOptions.forEach(option => {

        const optionElement =
            document.createElement("option");

        optionElement.value = option.quantity;

        optionElement.textContent =
            option.label +
            " — ₹" +
            option.price.toLocaleString("en-IN");

        packSelect.appendChild(optionElement);

    });

    if (product.wholesale) {
        wholesaleBox.style.display = "block";
    }

    selectPack();
}


/* Select Pack */

function selectPack() {

    if (!product.packOptions) {
        return;
    }

    const packSelect =
        document.getElementById("packSelect");

    const selectedQuantity =
        parseInt(packSelect.value);

    const selectedOption =
        product.packOptions.find(
            option =>
                option.quantity === selectedQuantity
        );

    if (!selectedOption) {
        return;
    }

        selectedPackPrice =
        selectedOption.price;
    document.getElementById("productPrice").textContent =
        "₹" +
        selectedPackPrice.toLocaleString("en-IN");
}


/* Add to Cart */

function addProductToCart() {

    let cart =
        JSON.parse(
            localStorage.getItem("everstmartCart")
        ) || [];


    let itemQuantity = 1;
    let itemPrice = product.price;
    let itemPack = null;
    let itemPackQuantity = 1;


    /* Products with Pack Selector */

    if (product.packOptions) {

        const packSelect =
            document.getElementById("packSelect");

        const selectedQuantity =
            parseInt(packSelect.value);

        const selectedOption =
            product.packOptions.find(
                option =>
                    option.quantity === selectedQuantity
            );

        if (!selectedOption) {
            return;
        }

        itemQuantity =
            selectedOption.quantity;

        itemPrice =
            selectedOption.price;

        itemPack =
            selectedOption.label;

        itemPackQuantity =
            selectedOption.quantity;

    }


    /* Stock Check */

    const piecesInCart = cart
        .filter(function (cartItem) {
            return cartItem.name === product.name;
        })
        .reduce(function (sum, cartItem) {
            return sum + (Number(cartItem.packQuantity) || 1);
        }, 0);

    if (piecesInCart + itemQuantity > product.stock) {

        alert(
            "Only " +
            product.stock +
            " available for " +
            product.name +
            "."
        );

        return;
    }


    /* Add Item */

    cart.push({

        id: product.id,

        name: product.name,

        price: itemPrice,

        quantity: 1,

        pack: itemPack,

        packQuantity: itemPackQuantity

    });


    localStorage.setItem(
        "everstmartCart",
        JSON.stringify(cart)
    );


    if (product.packOptions) {

        alert(
            itemPack +
            " × " +
            product.name +
            " added to cart."
        );

    } else {

        alert(
            product.name +
            " added to cart."
        );

    }

}


/* Buy Now */

function buyProductNow() {

    let cart = [];


    let itemPrice = product.price;
    let itemPack = null;
    let itemPackQuantity = 1;


    /* Products with Pack Selector */

    if (product.packOptions) {

        const packSelect =
            document.getElementById("packSelect");

        const selectedQuantity =
            parseInt(packSelect.value);

        const selectedOption =
            product.packOptions.find(
                option =>
                    option.quantity === selectedQuantity
            );

        if (!selectedOption) {
            return;
        }

        itemPrice =
            selectedOption.price;

        itemPack =
            selectedOption.label;

        itemPackQuantity =
            selectedOption.quantity;

    }


    /* Stock Check */

    if (itemPackQuantity > product.stock) {

        alert(
            "Only " +
            product.stock +
            " available for " +
            product.name +
            "."
        );

        return;
    }


    /* Buy Now Item */

    cart.push({

        id: product.id,

        name: product.name,

        price: itemPrice,

        quantity: 1,

        pack: itemPack,

        packQuantity: itemPackQuantity

    });


    localStorage.setItem(
        "everstmartCart",
        JSON.stringify(cart)
    );


    window.location.href =
        "cart.html";

}


/* Set up product options */

if (product) {
    setupPackSelector();
}

</script>

</body>
</html>
