<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everstmart - Tibetan Collection</title>


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #ccc;
    }

    .hero {
      background: white;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
    }

    .products {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .product-content {
      padding: 18px;
    }

    .product h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .category {
      color: #777;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everstmart</h1>
    <p>Tibetan Collection & Traditional Products</p>
  </header>

  <section class="hero">
    <h2>Welcome to Everstmart</h2>
    <p>Discover authentic Tibetan-inspired products and traditional collections.</p>
  </section>

  <main class="products">

    <div class="product">
      <img src="Carpet.PNG" alt="Tibetan Traditional Carpet">

      <div class="product-content">
        <h3>Tibetan Traditional Carpet</h3>
        <div class="category">Tibetan Collection</div>
        <div class="price">₹15,000</div>

        <button onclick="addToCart('Tibetan Traditional Carpet', 15000)">
          Add to Cart
        </button>
      </div>
    </div>

    <div class="product">
      <img src="Potala big.PNG" alt="Potala Incense">

      <div class="product-content">
        <h3>Potala Incense</h3>
        <div class="category">Incense</div>
        <div class="price">₹100</div>

        <button onclick="addToCart('Potala Incense', 100)">
          Add to Cart
        </button>
      </div>
    </div>

  </main>

  <footer>
    <p>© 2026 Everstmart. All rights reserved.</p>
  </footer>


  <script>
let cart = [];

function addToCart(name, price) {
  cart.push({ name, price });
  updateCart();
}

function updateCart() {
  let total = cart.reduce((sum, item) => sum + item.price, 0);

  let cartBox = document.getElementById("cartBox");

  if (!cartBox) {
    cartBox = document.createElement("div");
    cartBox.id = "cartBox";
    cartBox.style.cssText =
      "position:fixed;bottom:20px;right:20px;background:white;padding:20px;border-radius:15px;box-shadow:0 5px 25px #999;z-index:9999;max-width:320px;font-family:Arial;";
    document.body.appendChild(cartBox);
  }

  let groupedCart = {};

cart.forEach((item) => {
  if (!groupedCart[item.name]) {
    groupedCart[item.name] = {
      price: item.price,
      quantity: 0
    };
  }
  groupedCart[item.name].quantity++;
});

let items = Object.entries(groupedCart).map(([name, item]) => `
  <div style="padding:12px 0;border-bottom:1px solid #ddd;">
    <div style="font-weight:bold;margin-bottom:8px;">
      ${name} - ₹${item.price.toLocaleString("en-IN")}
    </div>

    <div style="display:flex;align-items:center;gap:10px;">
      <button onclick="decreaseQuantity('${name}')"
        style="width:40px;height:35px;font-size:20px;">−</button>

      <span style="font-size:18px;font-weight:bold;">
        ${item.quantity}
      </span>

      <button onclick="increaseQuantity('${name}')"
        style="width:40px;height:35px;font-size:20px;">+</button>
    </div>
  </div>
`).join("");

  cartBox.innerHTML = `
    <h2>🛒 Your Cart</h2>
    ${items || "<p>Your cart is empty.</p>"}
    <h3>Total: ₹${total.toLocaleString("en-IN")}</h3>
    <button onclick="checkout()" style="width:100%;padding:12px;background:#111;color:white;border:0;border-radius:8px;font-size:16px;">
      Place Order
    </button>
  `;
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}
    function increaseQuantity(name) {
  const item = cart.find(item => item.name === name);

  if (item) {
    cart.push({
      name: item.name,
      price: item.price
    });
  }

  updateCart();
}

function decreaseQuantity(name) {
  const index = cart.findIndex(item => item.name === name);

  if (index !== -1) {
    cart.splice(index, 1);
  }

  updateCart();
}

function checkout() {
  if (cart.length === 0) {
    alert("Your cart is empty.");
    return;
  }

  let checkoutBox = document.createElement("div");

  checkoutBox.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  `;

  checkoutBox.innerHTML = `
    <div style="
      background:white;
      width:100%;
      max-width:500px;
      max-height:90vh;
      overflow-y:auto;
      border-radius:20px;
      padding:25px;
      box-sizing:border-box;
    ">

      <h2 style="margin-top:0;">🛒 Everstmart Checkout</h2>

      <p style="color:#666;">Please enter your delivery details.</p>

      <label><b>Full Name</b></label>
      <input id="customerName" type="text"
        placeholder="Enter your full name"
        style="width:100%;padding:14px;margin:8px 0 18px;
        box-sizing:border-box;border:1px solid #ccc;border-radius:10px;">

      <label><b>Phone Number</b></label>
      <input id="customerPhone" type="tel"
        placeholder="Enter your phone number"
        style="width:100%;padding:14px;margin:8px 0 18px;
        box-sizing:border-box;border:1px solid #ccc;border-radius:10px;">

      <label><b>Delivery Address</b></label>
      <textarea id="customerAddress"
        placeholder="Enter your complete delivery address"
        rows="4"
        style="width:100%;padding:14px;margin:8px 0 18px;
        box-sizing:border-box;border:1px solid #ccc;border-radius:10px;"></textarea>

      <h3>Order Summary</h3>

      <div style="
        background:#f5f5f5;
        padding:15px;
        border-radius:10px;
        margin-bottom:20px;
      ">
        ${cart.map(item => `
          <div style="padding:6px 0;">
            ${item.name} — ₹${item.price.toLocaleString("en-IN")}
          </div>
        `).join("")}

        <hr>

        <b style="font-size:18px;">
          Total: ₹${cart.reduce((sum, item) => sum + item.price, 0).toLocaleString("en-IN")}
        </b>
      </div>

      <button id="whatsappOrderBtn" style="
        width:100%;
        padding:15px;
        background:#25D366;
        color:white;
        border:none;
        border-radius:10px;
        font-size:17px;
        font-weight:bold;
        margin-bottom:10px;
      ">
        📲 Place Order on WhatsApp
      </button>

      <button id="closeCheckoutBtn" style="
        width:100%;
        padding:13px;
        background:#eee;
        color:#333;
        border:none;
        border-radius:10px;
        font-size:16px;
      ">
        Cancel
      </button>

    </div>
  `;

  document.body.appendChild(checkoutBox);

  document.getElementById("closeCheckoutBtn").onclick = function() {
    checkoutBox.remove();
  };

  document.getElementById("whatsappOrderBtn").onclick = function() {

    let name = document.getElementById("customerName").value.trim();
    let phone = document.getElementById("customerPhone").value.trim();
    let address = document.getElementById("customerAddress").value.trim();

    if (!name) {
      alert("Please enter your full name.");
      return;
    }

    if (!phone) {
      alert("Please enter your phone number.");
      return;
    }

    if (!address) {
      alert("Please enter your delivery address.");
      return;
    }

    let total = cart.reduce((sum, item) => sum + item.price, 0);

    let orderDetails =
      "EVERSTMART ORDER\n\n" +
      "Customer: " + name + "\n" +
      "Phone: " + phone + "\n" +
      "Address: " + address + "\n\n" +
      "Products:\n" +
      cart.map(item =>
        item.name + " - ₹" + item.price.toLocaleString("en-IN")
      ).join("\n") +
      "\n\nTotal: ₹" + total.toLocaleString("en-IN");

    let whatsappURL =
      "https://wa.me/918580804579?text=" +
      encodeURIComponent(orderDetails);

    window.location.href = whatsappURL;
  };
}
</script>

</body>
</html>
