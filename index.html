<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everstmart - Tibetan Collection</title>


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #ccc;
    }

    .hero {
      background: white;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
    }

    .products {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .product-content {
      padding: 18px;
    }

    .product h3 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .category {
      color: #777;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 40px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Everstmart</h1>
    <p>Tibetan Collection & Traditional Products</p>
  </header>

  <section class="hero">
    <h2>Welcome to Everstmart</h2>
    <p>Discover authentic Tibetan-inspired products and traditional collections.</p>
  </section>

  <main class="products">

    <div class="product">
      <img src="Carpet.PNG" alt="Tibetan Traditional Carpet">

      <div class="product-content">
        <h3>Tibetan Traditional Carpet</h3>
        <div class="category">Tibetan Collection</div>
        <div class="price">₹15,000</div>

        <button onclick="addToCart('Tibetan Traditional Carpet', 15000)">
          Add to Cart
        </button>
      </div>
    </div>

    <div class="product">
      <img src="Potala big.PNG" alt="Potala Incense">

      <div class="product-content">
        <h3>Potala Incense</h3>
        <div class="category">Incense</div>
        <div class="price">₹100</div>

        <button onclick="addToCart('Potala Incense', 100)">
          Add to Cart
        </button>
      </div>
    </div>

  </main>

  <footer>
    <p>© 2026 Everstmart. All rights reserved.</p>
  </footer>


  <script>
let cart = [];

function addToCart(name, price) {
  cart.push({ name, price });
  updateCart();
}

function updateCart() {
  let total = cart.reduce((sum, item) => sum + item.price, 0);

  let cartBox = document.getElementById("cartBox");

  if (!cartBox) {
    cartBox = document.createElement("div");
    cartBox.id = "cartBox";
    cartBox.style.cssText =
      "position:fixed;bottom:20px;right:20px;background:white;padding:20px;border-radius:15px;box-shadow:0 5px 25px #999;z-index:9999;max-width:320px;font-family:Arial;";
    document.body.appendChild(cartBox);
  }

  let items = cart.map((item, index) =>
    `<div style="padding:8px 0;border-bottom:1px solid #ddd;">
      ${item.name} - ₹${item.price.toLocaleString("en-IN")}
      <button onclick="removeFromCart(${index})" style="float:right;">Remove</button>
    </div>`
  ).join("");

  cartBox.innerHTML = `
    <h2>🛒 Your Cart</h2>
    ${items || "<p>Your cart is empty.</p>"}
    <h3>Total: ₹${total.toLocaleString("en-IN")}</h3>
    <button onclick="checkout()" style="width:100%;padding:12px;background:#111;color:white;border:0;border-radius:8px;font-size:16px;">
      Place Order
    </button>
  `;
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function checkout() {
    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    let total = cart.reduce((sum, item) => sum + item.price, 0);

    let orderDetails =
        "Order Summary\n\n" +
        cart.map(item =>
            item.name + " - ₹" + item.price.toLocaleString("en-IN")
        ).join("\n") +
        "\n\nTotal: ₹" + total.toLocaleString("en-IN");

    alert(orderDetails);
}
</script>

</body>
</html>
